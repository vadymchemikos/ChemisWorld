name: Android APK build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          mkdir -p /tmp/chemis
          unzip -q ChemisWorld_6.0.2.zip -d /tmp/chemis
          cp -a /tmp/chemis/ChemisWorld/. .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
         gradle-version: '8.9'
               
      - name: Align Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          marker = "    defaultConfig {"
          insert = """    compileOptions {
          sourceCompatibility = JavaVersion.VERSION_17
          targetCompatibility = JavaVersion.VERSION_17
          }
          kotlinOptions {
          jvmTarget = "17"
          }
          """
          if marker not in s:
              raise SystemExit("defaultConfig not found")
          if "VERSION_17" not in s:
              s = s.replace(marker, insert + marker, 1)
          p.write_text(s)
          PY
           
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chemis-world-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
