name: ChemisWorld 7.0.3 Android APK build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="ChemisWorld_7.0.3_WEB_CLERK_FIX.zip"
          test -f "$ARCHIVE" || { echo "Missing $ARCHIVE in repository root"; exit 1; }
          mkdir -p /tmp/chemis
          unzip -q "$ARCHIVE" -d /tmp/chemis
          test -f /tmp/chemis/ChemisWorld/app/build.gradle.kts
          cp -a /tmp/chemis/ChemisWorld/. .
          test -f app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK with dependency download retries
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3 4; do
            echo "APK build attempt ${attempt}/4"
            if gradle --no-daemon --stacktrace :app:assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Build failed. Waiting 30 seconds before retry..."
              sleep 30
            fi
          done
          echo "APK build failed after 4 attempts."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chemisworld-7.0.3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
         
