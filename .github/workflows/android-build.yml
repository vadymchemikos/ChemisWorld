name: ChemisWorld 7.1.4 Android APK build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="ChemisWorld_7.1.4_WEB_CLERK_FIX.zip"
          test -f "$ARCHIVE" || { echo "Missing $ARCHIVE in repository root"; exit 1; }
          mkdir -p /tmp/chemis
          unzip -q "$ARCHIVE" -d /tmp/chemis
          test -f /tmp/chemis/ChemisWorld/app/build.gradle.kts
          cp -a /tmp/chemis/ChemisWorld/. .
          test -f app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK with Java and Kotlin 17
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions {" in s:
              s = re.sub(
                  r'compileOptions\s*\{.*?\}',
                  '''compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }''',
                  s, count=1, flags=re.S
              )
          else:
              s = s.replace("android {", """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""", 1)

          if "kotlinOptions {" in s:
              s = re.sub(
                  r'kotlinOptions\s*\{.*?\}',
                  '''kotlinOptions {
                  jvmTarget = "17"
              }''',
                  s, count=1, flags=re.S
              )
          else:
              pos = s.find("android {")
              start = s.find("{", pos)
              depth = 1
              i = start + 1
              while depth:
                  if s[i] == "{": depth += 1
                  elif s[i] == "}": depth -= 1
                  i += 1
              s = s[:i-1] + '''
              kotlinOptions {
                  jvmTarget = "17"
              }
          ''' + s[i-1:]

          p.write_text(s)
          PY

          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chemisworld-7.1.4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
         
